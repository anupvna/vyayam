# Render blueprint: one free web service built from the Dockerfile.
# The database is Neon (free Postgres); paste its connection string as DATABASE_URL
# in the Render dashboard. It is never stored in this file or in Git.
services:
  - type: web
    name: vyayam
    runtime: docker
    plan: free
    region: virginia  # near New York; the Neon database should be in AWS US East too
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true  # every push to main goes live
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      # AI coach keys (optional): set in the dashboard, never here.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

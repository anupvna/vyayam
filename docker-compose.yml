services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: vyayam
      POSTGRES_PASSWORD: vyayam
      POSTGRES_DB: vyayam
    ports:
      - "5433:5432" # host 5433 -> container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyayam -d vyayam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
